        <script>
        // Deteksi cerdas Base URL agar seluruh aset relatif & portfolio_data.json selalu valid di GitHub Pages, Localhost, maupun Subfolder
        (function() {
            try {
                var loc = window.location;
                if (loc.protocol !== 'file:') {
                    var p = loc.pathname || '';
                    var lastSlash = p.lastIndexOf('/');
                    var folder = lastSlash >= 0 ? p.substring(0, lastSlash + 1) : '/';
                    var b = document.createElement('base');
                    b.href = loc.origin + folder;
                    document.head.appendChild(b);
                }
            } catch(e) {}
        })();
    </script>

            transition: background-color 0.3s ease;

        .dark body {

            background-image: radial-gradient(#334155 1px, transparent 1px);
        }

        /* Efek Blur Halus untuk Skeleton / Placeholder */
        @keyframes smoothPulse {
            0%, 100% { opacity: 0.35; transform: scale(0.99); }
            50% { opacity: 0.75; transform: scale(1); }
        }
        .skeleton-blur {
            background: rgba(148, 163, 184, 0.25);
            filter: blur(6px);
            border-radius: 9999px;
            animation: smoothPulse 1.8s infinite ease-in-out;
        }
        .dark .skeleton-blur {
            background: rgba(255, 255, 255, 0.12);
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translateY(12px) scale(0.99); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-popup {
            opacity: 0;
            animation: popUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .dropdown-menu {
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform-origin: top right;
        }
        .dropdown-menu.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .bento-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.03);
            text-decoration: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .bento-card:hover {
            border-color: #14b8a6;
            box-shadow: 0 15px 25px -5px rgb(20 184 166 / 0.15);
            transform: translateY(-4px) scale(1.01);
        }

        .school-link {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .school-link:hover, .school-link:active { color: #0d9488; }
        .dark .school-link:hover, .dark .school-link:active { color: #2dd4bf; }
        .school-link:hover .school-arrow, .school-link:active .school-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .bento-card:active {
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 6px 12px -3px rgb(20 184 166 / 0.1);
        }

        .dark .bento-card {
            background: #1e293b;
            border-color: #334155;
        }
        
        .dark .bento-card:hover {
            border-color: #14b8a6;
            box-shadow: 0 15px 25px -5px rgb(20 184 166 / 0.3);
        }
    </style>

            video: { colorConfig: { bg: 'bg-blue-50 dark:bg-blue-900/20', text: 'text-blue-600 dark:text-blue-400', hoverBg: 'group-hover:bg-blue-600 dark:group-hover:bg-blue-600' }, svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>` },
            dokumen: { colorConfig: { bg: 'bg-purple-50 dark:bg-purple-900/20', text: 'text-purple-600 dark:text-purple-400', hoverBg: 'group-hover:bg-purple-600 dark:group-hover:bg-purple-600' }, svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>` },
            presentasi: { colorConfig: { bg: 'bg-orange-50 dark:bg-orange-900/20', text: 'text-orange-600 dark:text-orange-400', hoverBg: 'group-hover:bg-orange-600 dark:group-hover:bg-orange-600' }, svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>` },
            foto: { colorConfig: { bg: 'bg-emerald-50 dark:bg-emerald-900/20', text: 'text-emerald-600 dark:text-emerald-400', hoverBg: 'group-hover:bg-emerald-600 dark:group-hover:bg-emerald-600' }, svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>` }
        };

        // FUNGSI FETCH DARI SERVER (Asinkron & Real-Time Sync)
        async function fetchPortfolioDataFromServer() {
            try {
                // 1. Coba ambil data live terbaru dari portfolio_data.json
                try {
                    const response = await fetch('portfolio_data.json?v=' + Date.now(), { cache: 'no-store' });
                    if (response.ok) {
                        const liveData = await response.json();
                        if (liveData && liveData.profil && liveData.profil.namaLengkap) {
                            return liveData;
                        }
                    }
                } catch (netErr) {
                    // Fallback jika dibuka via file:// lokal tanpa web server
                }

                // 2. Fallback instan ke PORTFOLIO_DATA internal
                if (typeof PORTFOLIO_DATA !== 'undefined' && PORTFOLIO_DATA) {
                    return PORTFOLIO_DATA;
                }
                return null;
            } catch (error) {
                console.error("Kesalahan koneksi data:", error);
                return (typeof PORTFOLIO_DATA !== 'undefined') ? PORTFOLIO_DATA : null;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Tema Terang / Gelap
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            function updateThemeIcons() {
                if (document.documentElement.classList.contains('dark')) {
                    themeToggleLightIcon.classList.remove('hidden');
                    themeToggleDarkIcon.classList.add('hidden');
                } else {
                    themeToggleLightIcon.classList.add('hidden');
                    themeToggleDarkIcon.classList.remove('hidden');
                }
            }
            updateThemeIcons();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    themeToggleDarkIcon.classList.toggle('hidden');
                    themeToggleLightIcon.classList.toggle('hidden');
                    
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    }
                });
            }

            // MENUNGGU RESPONS SERVER
            const data = await fetchPortfolioDataFromServer();
            if (!data) return;

            // 1. RENDER PROFIL
            document.getElementById('render-jurusan').textContent = data.profil.jurusan;
            document.getElementById('render-nama').textContent = data.profil.namaLengkap;
            document.getElementById('render-nim').textContent = data.profil.nim;
            
            const descEl = document.getElementById('render-deskripsi');
            descEl.textContent = data.profil.deskripsi;
            descEl.className = `text-slate-600 dark:text-slate-400 leading-relaxed text-sm sm:text-base ${data.profil.deskripsiAlignment || "text-justify"}`;

            const imgEl = document.getElementById('render-foto');
            if (data.profil.pathFoto && data.profil.pathFoto.trim() !== "") {
                imgEl.src = data.profil.pathFoto.trim();
            } else {
                imgEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.profil.namaLengkap)}&background=0f172a&color=14b8a6&size=256`;
            }
            imgEl.onerror = function() {
                this.onerror = null;
                this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.profil.namaLengkap)}&background=0f172a&color=14b8a6&size=256`;
            };

            document.getElementById('skeleton-profile').classList.add('hidden');
            document.getElementById('real-profile').classList.remove('hidden');

            // 2. RENDER SKILLS
            const skillsContainer = document.getElementById('render-skills');
            skillsContainer.innerHTML = "";
            data.skills.forEach((skill) => {
                const styling = "bg-slate-100 dark:bg-slate-700/50 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 transition-all duration-200 hover:scale-105 hover:border-brand-500 cursor-default text-xs sm:text-sm";
                skillsContainer.insertAdjacentHTML('beforeend', `<span class="px-3.5 py-1.5 font-medium rounded-lg border ${styling}">${skill}</span>`);
            });
            document.getElementById('skeleton-skills').classList.add('hidden');
            skillsContainer.classList.remove('hidden');

            // 3. RENDER RIWAYAT SEKOLAH
            const riwayatContainer = document.getElementById('render-riwayat');
            riwayatContainer.innerHTML = "";
            data.riwayatSekolah.forEach((item) => {
                let logoImgHtml = '';
                if (item.pathLogo && item.pathLogo.trim() !== "") {
                    logoImgHtml = `<img src="${item.pathLogo.trim()}" alt="School Logo" class="w-12 h-12 sm:w-14 sm:h-14 object-contain flex-shrink-0 group-hover:scale-105 transition-transform duration-300" loading="lazy">`;
                } else {
                    logoImgHtml = `<div class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center font-display font-bold text-2xl flex-shrink-0 group-hover:scale-105 transition-transform duration-300">🏫</div>`;
                }

                const schoolAlign = item.deskripsiAlignment || "text-justify";
                riwayatContainer.insertAdjacentHTML('beforeend', `
                    <div class="bento-card p-6 sm:p-8 flex flex-col gap-4 group relative overflow-hidden animate-popup">
                        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-brand-500/5 rounded-full blur-2xl group-hover:bg-brand-500/15 transition-all duration-500"></div>
                        <div class="flex items-center gap-4 relative z-10">
                            ${logoImgHtml}
                            <div class="space-y-1 flex-1 min-w-0">
                                <p class="text-xs sm:text-sm font-semibold text-brand-600 dark:text-brand-400">${item.jenjang}</p>
                                <h3 class="font-display font-bold text-base sm:text-xl text-slate-900 dark:text-white">
                                    <a href="${item.linkSekolah}" target="_blank" rel="noopener noreferrer" class="school-link transition-colors inline-flex items-center gap-1.5 break-words text-slate-900 dark:text-white">
                                        <span>${item.namaSekolah}</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="school-arrow h-4 w-4 flex-shrink-0 opacity-0 transform -translate-x-2 transition-all duration-300 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                    </a>
                                </h3>
                            </div>
                        </div>
                        <p class="text-slate-600 dark:text-slate-400 text-sm sm:text-base leading-relaxed relative z-10 ${schoolAlign}">${item.deskripsi}</p>
                    </div>
                `);
            });
            document.getElementById('skeleton-riwayat').classList.add('hidden');
            riwayatContainer.classList.remove('hidden');

            // 4. RENDER KONTAK
            const kontakContainer = document.getElementById('render-kontak');
            kontakContainer.innerHTML = "";
            data.kontak.forEach((item) => {
                let svgIcon = '';
                let hoverColorClass = '';
                if (item.ikon === 'email') {
                    hoverColorClass = 'group-hover:text-blue-500';
                    svgIcon = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block group-hover:hidden transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                        <svg class="h-5 w-5 hidden group-hover:block transition-all" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#3B82F6" d="M22.5 4H1.5C.672 4 0 4.672 0 5.5v13C0 19.328.672 20 1.5 20h21c.828 0 1.5-.672 1.5-1.5v-13C24 4.672 23.328 4 22.5 4z"/>
                            <path fill="#60A5FA" d="M12 13L24 5.5V5c0-.828-.672-1.5-1.5-1.5h-21C.672 3.5 0 4.172 0 5v.5L12 13z"/>
                            <path fill="#2563EB" d="M0 18.5V6.5l8 5L0 18.5z"/>
                            <path fill="#1D4ED8" d="M24 18.5v-12l-8 5 8 7z"/>
                        </svg>
                    `;
                } else if (item.ikon === 'linkedin') {
                    hoverColorClass = 'group-hover:text-[#0A66C2]';
                    svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-colors" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>`;
                } else if (item.ikon === 'instagram') {
                    hoverColorClass = 'group-hover:text-[#E4405F]';
                    svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-colors" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`;
                } else {
                    hoverColorClass = 'group-hover:text-brand-500';
                    svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>`;
                }

                const isEmail = item.tipe === 'email';
                const hrefVal = isEmail ? '#' : item.nilai;
                const targetAttr = isEmail ? '' : 'target="_blank" rel="noopener noreferrer"';
                const dataEmailAttr = isEmail ? `data-email="${item.nilai}" data-type="email"` : '';

                kontakContainer.insertAdjacentHTML('beforeend', `
                    <a href="${hrefVal}" ${targetAttr} ${dataEmailAttr} class="bento-card p-4 flex items-center gap-3 text-slate-700 dark:text-slate-300 group cursor-pointer animate-popup">
                        <div class="p-2.5 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 ${hoverColorClass} rounded-xl group-hover:scale-110 group-hover:rotate-6 transition-transform relative flex items-center justify-center w-10 h-10">
                            ${svgIcon}
                        </div>
                        <div class="truncate">
                            <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">${item.namaPlatform}</p>
                            <span class="text-sm font-semibold truncate block group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">${item.label}</span>
                        </div>
                    </a>
                `);
            });
            document.getElementById('skeleton-kontak').classList.add('hidden');
            kontakContainer.classList.remove('hidden');

            // Handler Interaksi Salin Email
            document.querySelectorAll('[data-type="email"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const email = el.getAttribute('data-email');
                    try { window.location.href = `mailto:${email}`; } catch (err) {}
                    navigator.clipboard.writeText(email).then(() => {
                        const toastEl = document.getElementById('email-toast');
                        document.getElementById('toast-text').textContent = `Email (${email}) copied!`;
                        toastEl.classList.remove('translate-y-20', 'opacity-0');
                        setTimeout(() => { toastEl.classList.add('translate-y-20', 'opacity-0'); }, 3000);
                    }).catch(() => { window.open(`mailto:${email}`); });
                });
            });

            // 5. RENDER TASKS (ASSIGNMENTS)
            renderTasks(data.tugas);
            document.getElementById('skeleton-tugas').classList.add('hidden');
            document.getElementById('render-tugas').classList.remove('hidden');

            function getTaskAntiLoginUrl(tugas) {
                let isPhp = true;
                try {
                    const topUrl = (window.top && window.top.location && window.top.location.href) ? window.top.location.href : window.location.href;
                    if (topUrl.indexOf('github.io') !== -1 || (topUrl.indexOf('.html') !== -1 && topUrl.indexOf('.php') === -1)) {
                        isPhp = false;
                    }
                } catch (e) {
                    if (window.location.hostname.includes('github.io')) {
                        isPhp = false;
                    }
                }

                const page = isPhp ? '../../preview.php' : '../../preview.html';
                if (tugas && tugas.id) {
                    return `${page}?type=individual&id=${encodeURIComponent(tugas.id)}`;
                }
                const link = toPreviewUrl(tugas ? tugas.linkTugas : '');
                return `${page}?type=individual&url=${encodeURIComponent(link)}&title=${encodeURIComponent((tugas && tugas.judul) ? tugas.judul : 'Tugas Individu')}&uploader=${encodeURIComponent('Febrian Alfarizzi')}`;
            }

            function toPreviewUrl(url) {
                if (!url || typeof url !== 'string') return url;
                let u = url.trim();
                if (u.includes('<iframe') && u.includes('src=')) {
                    const sm = u.match(/src=["']([^"']+)["']/i);
                    if (sm && sm[1]) u = sm[1];
                }
                const dm = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_\-]+)/i);
                if (dm && dm[1]) return `https://drive.google.com/file/d/${dm[1]}/preview`;
                const pm = u.match(/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_\-]+)/i);
                if (pm && pm[1]) return `https://docs.google.com/presentation/d/${pm[1]}/preview`;
                const dcm = u.match(/docs\.google\.com\/document\/d\/([a-zA-Z0-9_\-]+)/i);
                if (dcm && dcm[1]) return `https://docs.google.com/document/d/${dcm[1]}/preview`;
                const shm = u.match(/docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9_\-]+)/i);
                if (shm && shm[1]) return `https://docs.google.com/spreadsheets/d/${shm[1]}/preview`;
                const fm = u.match(/drive\.google\.com\/drive\/folders\/([a-zA-Z0-9_\-]+)/i);
                if (fm && fm[1]) return `https://drive.google.com/embeddedfolderview?id=${fm[1]}#list`;
                const ym = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_\-]{11})/i);
                if (ym && ym[1]) return `https://www.youtube.com/embed/${ym[1]}?autoplay=0&rel=0`;
                return u;
            }

            function renderTasks(tugasList, searchQuery = "", selectedCategory = "all") {
                const tugasContainer = document.getElementById('render-tugas');
                tugasContainer.innerHTML = "";

                const filtered = tugasList.filter(t => {
                    const matchesSearch = t.judul.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          t.deskripsi.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCategory = selectedCategory === "all" || t.kategoriIkon === selectedCategory;
                    return matchesSearch && matchesCategory;
                });

                if (filtered.length === 0) {
                    tugasContainer.innerHTML = `
                        <div class="lg:col-span-4 bento-card p-12 text-center text-slate-400 dark:text-slate-500 animate-popup">
                            <p class="text-base font-medium">No assignments found matching your criteria</p>
                        </div>
                    `;
                    return;
                }

                filtered.forEach((tugas, index) => {
                    const categoryData = icons[tugas.kategoriIkon] || icons.video; 
                    const c = categoryData.colorConfig;
                    
                    let iconDisplay = categoryData.svg;
                    if (tugas.pathIcon && tugas.pathIcon.trim() !== "") {
                        iconDisplay = `<img src="${tugas.pathIcon.trim()}" alt="Task Logo" class="w-full h-full object-cover rounded-xl" loading="lazy" onerror="this.onerror=null; this.replaceWith(document.createTextNode('📁'));">`;
                    }

                    const taskAlign = tugas.deskripsiAlignment || "text-justify";
                    const staggerDelay = index * 75;
                    
                    const cardHtml = `
                        <div class="animate-popup h-full" style="animation-delay: ${staggerDelay}ms;">
                            <div class="bento-card p-6 flex flex-col justify-between group h-full">
                                <div>
                                    <div class="w-12 h-12 ${c.bg} ${c.text} rounded-xl flex items-center justify-center mb-4 overflow-hidden ${c.hoverBg} group-hover:text-white transition-all duration-300 group-hover:rotate-3">
                                        ${iconDisplay}
                                    </div>
                                    <h3 class="font-bold text-xl text-slate-900 dark:text-white mb-2">${tugas.judul}</h3>
                                    <p class="text-slate-600 dark:text-slate-400 text-sm mb-6 leading-relaxed ${taskAlign}">${tugas.deskripsi}</p>
                                </div>
                                <a href="${getTaskAntiLoginUrl(tugas)}" target="_top" class="inline-flex items-center justify-between w-full px-4 py-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-xl font-medium text-sm hover:bg-brand-50 dark:hover:bg-brand-900/30 hover:border-brand-300 dark:hover:border-brand-700/50 hover:text-brand-700 dark:hover:text-brand-400 transition-all cursor-pointer">
                                    <span>${tugas.teksTombol}</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                                </a>
                            </div>
                        </div>
                    `;
                    tugasContainer.insertAdjacentHTML('beforeend', cardHtml);
                });
            }

            // Search & Filter Dropdown Event Listeners
            const searchInput = document.getElementById('task-search');
            const filterBtn = document.getElementById('filter-btn');
            const filterDropdownMenu = document.getElementById('filter-dropdown-menu');
            const filterChevron = document.getElementById('filter-chevron');
            const filterSelectedText = document.getElementById('filter-selected-text');
            const filterOptions = document.querySelectorAll('.filter-option');
            let currentCategory = "all";

            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterDropdownMenu.classList.toggle('show');
                filterChevron.classList.toggle('rotate-180');
            });

            document.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!filterBtn.contains(e.target) && !filterDropdownMenu.contains(e.target)) {
                    filterDropdownMenu.classList.remove('show');
                    filterChevron.classList.remove('rotate-180');
                }
            });

            window.addEventListener('scroll', () => {
                if (filterDropdownMenu.classList.contains('show')) {
                    filterDropdownMenu.classList.remove('show');
                    filterChevron.classList.remove('rotate-180');
                }
            });

            filterOptions.forEach(option => {
                option.addEventListener('click', () => {
                    currentCategory = option.getAttribute('data-value');
                    filterSelectedText.textContent = option.textContent;
                    filterDropdownMenu.classList.remove('show');
                    filterChevron.classList.remove('rotate-180');
                    renderTasks(data.tugas, searchInput.value, currentCategory);
                });
            });

            searchInput.addEventListener('input', () => {
                renderTasks(data.tugas, searchInput.value, currentCategory);
            });
        });
    </script>
</body>
</html>
