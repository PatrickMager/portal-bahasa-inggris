(function() {
    document.querySelectorAll('iframe[data-src]').forEach(function(ifr) {
        var ds = ifr.getAttribute('data-src');
        if (ds && !ifr.getAttribute('src')) {
            ifr.setAttribute('src', ds);
        }
        ifr.classList.remove('L6cTce-purZT', 'L6cTce-pSzOP');
    });
    document.querySelectorAll('.WIdY2d[data-embed-doc-id]').forEach(function(wrap) {
        var docId = wrap.getAttribute('data-embed-doc-id');
        var ifr = wrap.querySelector('iframe');
        if (!ifr && docId) {
            ifr = document.createElement('iframe');
            ifr.className = 'YMEQtf';
            ifr.setAttribute('frameborder', '0');
            ifr.setAttribute('allowfullscreen', '');
            ifr.setAttribute('src', 'https://drive.google.com/file/d/' + docId + '/preview');
            wrap.appendChild(ifr);
        }
        var overlay = wrap.querySelector('.JmGwdf');
        if (overlay && ifr) {
            overlay.style.display = 'none';
        }
    });
    document.addEventListener('click', function(e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var origHref = a.getAttribute('data-original-href') || '';
        var rawHref = a.getAttribute('href') || '';
        var linkText = (a.textContent || '').trim().toLowerCase();
        var prevText = '';
        if (a.previousElementSibling) {
            prevText = (a.previousElementSibling.textContent || '').toLowerCase();
        } else if (a.parentElement) {
            prevText = (a.parentElement.textContent || '').toLowerCase();
        }

        // 1. Intercept Navigasi Tugas Kelompok / Team Assignment / Click here
        var isTeamAssignment = (
            rawHref.indexOf('team-assignments') !== -1 ||
            rawHref.indexOf('group_tasks') !== -1 ||
            origHref.indexOf('team-assignments') !== -1 ||
            origHref.indexOf('group_tasks') !== -1 ||
            a.hasAttribute('data-target-group-tasks') ||
            (linkText === 'click here' && prevText.indexOf('team assignment') !== -1) ||
            linkText.indexOf('team assignment') !== -1 ||
            linkText.indexOf('tugas kelompok') !== -1
        );

        if (isTeamAssignment) {
            e.preventDefault();
            e.stopPropagation();
            var isGitHub = (window.location.hostname.indexOf('github.io') !== -1) || 
                           (window.top && window.top.location && window.top.location.hostname.indexOf('github.io') !== -1) ||
                           (window.top && window.top.location && window.top.location.pathname.indexOf('.html') !== -1);
            var destUrl = isGitHub ? 'group_tasks.html' : 'group_tasks.php';
            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({ type: 'engspace-navigate-group-tasks', url: destUrl }, '*');
                } catch (pe) {}
            }
            if (window.top && window.top !== window) {
                try {
                    window.top.location.href = destUrl;
                    return;
                } catch (te) {}
            }
            window.location.href = destUrl;
            return;
        }

        if (!rawHref || rawHref.charAt(0) === '#') return;
        var isProxyEndpoint = (window.location.pathname.indexOf('/api/proxy.php') !== -1);
        if (isProxyEndpoint && origHref) {
            e.preventDefault();
            window.location.href = '/api/proxy.php?url=' + encodeURIComponent(origHref) + '&back=' + encodeURIComponent(window.location.href);
            return;
        }
        if (/^(?:sub_|std_)[a-zA-Z0-9_\-]+\.html$/i.test(rawHref) || rawHref.indexOf('/api/proxy.php') !== -1) {
            return;
        }
        var absUrl = origHref || a.href || rawHref;
        if (absUrl.indexOf('sites.google.com/') !== -1) {
            e.preventDefault();
            if (isProxyEndpoint) {
                window.location.href = '/api/proxy.php?url=' + encodeURIComponent(absUrl) + '&back=' + encodeURIComponent(window.location.href);
            } else if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'engspace-proxy-navigate', url: absUrl }, '*');
            }
        }
    }, true);
})();
